<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>FitLead Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0d0f;
    --surface: #151519;
    --surface2: #1d1d23;
    --surface3: #24242b;
    --border: #2d2d36;
    --border-soft: rgba(255,255,255,0.06);
    --accent: #c8ff57;
    --accent-dim: rgba(200,255,87,0.12);
    --text: #f2f2f2;
    --muted: #8a8a98;
    --muted2: #666675;
    --hot: #c8ff57;
    --cold: #ff7474;
    --pending: #ffcc66;
    --bot-bubble: #111114;
    --user-bubble: rgba(200,255,87,0.13);
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
  }

  body {
    font-family: 'Heebo', sans-serif;
    color: var(--text);
    background-image:
      radial-gradient(ellipse at 15% 10%, rgba(200,255,87,0.055), transparent 45%),
      radial-gradient(ellipse at 85% 90%, rgba(90,90,255,0.055), transparent 45%);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  button { font-family: inherit; }

  .app {
    width: 100%;
    max-width: 1280px;
    height: 100dvh;
    padding: 16px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 360px minmax(0, 1fr);
    gap: 16px;
}

  .panel {
    background: rgba(21,21,25,0.96);
    border: 1px solid var(--border);
    border-radius: 24px;
    overflow: hidden;
    min-height: 0;
    box-shadow: 0 24px 60px rgba(0,0,0,0.34);
  }

  .leads-panel {
    display: flex;
    flex-direction: column;
  }

  .panel-header {
    padding: 18px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .dashboard-title {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.4px;
  }

  .dashboard-subtitle {
    margin-top: 4px;
    color: var(--muted);
    font-size: 13px;
    font-weight: 300;
  }

  .search-wrap {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border-soft);
    flex-shrink: 0;
  }

  .search-input {
    width: 100%;
    height: 44px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    padding: 0 14px;
    outline: none;
    font-size: 15px;
  }

  .search-input:focus { border-color: rgba(200,255,87,0.45); }
  .search-input::placeholder { color: var(--muted2); }

  .leads-list {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 10px;
    -webkit-overflow-scrolling: touch;
  }

  .lead-card {
    width: 100%;
    border: 1px solid transparent;
    background: transparent;
    color: var(--text);
    border-radius: 18px;
    padding: 14px;
    text-align: right;
    cursor: pointer;
    display: grid;
    gap: 8px;
    transition: background 0.15s ease, border-color 0.15s ease, transform 0.12s ease;
  }

  .lead-card:hover { background: rgba(255,255,255,0.035); }
  .lead-card:active { transform: scale(0.99); }

  .lead-card.active {
    background: var(--accent-dim);
    border-color: rgba(200,255,87,0.22);
  }

  .lead-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .lead-name {
    font-size: 15px;
    font-weight: 650;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }

  .status-pill {
    flex-shrink: 0;
    font-size: 12px;
    font-weight: 700;
    padding: 5px 9px;
    border-radius: 999px;
    border: 1px solid transparent;
    line-height: 1;
  }

  .status-hot {
    color: var(--hot);
    background: rgba(200,255,87,0.11);
    border-color: rgba(200,255,87,0.22);
  }

  .status-cold {
    color: var(--cold);
    background: rgba(255,116,116,0.09);
    border-color: rgba(255,116,116,0.18);
  }

  .status-pending {
    color: var(--pending);
    background: rgba(255,204,102,0.09);
    border-color: rgba(255,204,102,0.18);
  }

  .lead-phone {
    color: var(--muted);
    font-size: 13px;
    direction: ltr;
    text-align: right;
  }

  .detail-panel {
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  .detail-empty {
    flex: 1;
    display: grid;
    place-items: center;
    padding: 24px;
    color: var(--muted);
    text-align: center;
  }

  .empty-card {
    max-width: 360px;
    padding: 24px;
    border: 1px dashed var(--border);
    border-radius: 22px;
    background: rgba(255,255,255,0.02);
  }

  .empty-icon {
    font-size: 32px;
    margin-bottom: 8px;
  }

  .lead-detail {
    display: none;
    flex: 1;
    min-height: 0;
    flex-direction: column;
  }

  .detail-topbar {
    padding: 16px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }

  .back-btn {
    display: none;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    border-radius: 12px;
    padding: 9px 12px;
    font-size: 14px;
    cursor: pointer;
  }

  .detail-person {
    min-width: 0;
    flex: 1;
  }

  .detail-name-row {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .detail-name {
    font-size: 20px;
    font-weight: 750;
    letter-spacing: -0.4px;
  }

  .detail-phone {
    margin-top: 3px;
    color: var(--muted);
    font-size: 14px;
    direction: ltr;
    text-align: right;
  }

  .detail-scroll {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 16px 18px 20px;
  }

  .summary-box {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 16px;
    margin-bottom: 16px;
  }

  .section-title {
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.4px;
    margin-bottom: 8px;
  }

  .summary-text {
    font-size: 15px;
    line-height: 1.7;
    white-space: pre-wrap;
  }

  .messages-title {
    margin: 4px 0 12px;
    font-size: 14px;
    color: var(--muted);
    font-weight: 700;
  }

  .chat-history {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .chat-msg {
    max-width: min(78%, 620px);
    display: flex;
    flex-direction: column;
  }

  .chat-msg.user {
    align-self: flex-end;
    align-items: flex-end;
  }

  .chat-msg.bot,
  .chat-msg.assistant {
    align-self: flex-start;
    align-items: flex-start;
  }

  .chat-bubble {
    padding: 11px 14px;
    border-radius: 18px;
    font-size: 14px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .chat-msg.user .chat-bubble {
    background: var(--user-bubble);
    border: 1px solid rgba(200,255,87,0.22);
    border-bottom-left-radius: 6px;
  }

  .chat-msg.bot .chat-bubble,
  .chat-msg.assistant .chat-bubble {
    background: var(--bot-bubble);
    border: 1px solid var(--border);
    border-bottom-right-radius: 6px;
  }

  .msg-time {
    margin-top: 4px;
    padding: 0 5px;
    font-size: 11px;
    color: var(--muted2);
  }

  .loading,
  .error {
    padding: 18px;
    color: var(--muted);
    font-size: 14px;
  }

  .error { color: #ff8b8b; }

  @media (max-width: 760px) {
    .app {
      padding: 0;
      display: block;
      height: 100dvh;
    }

    .panel {
      border-radius: 0;
      border: none;
      box-shadow: none;
      height: 100dvh;
    }

    .leads-panel,
    .detail-panel {
      width: 100%;
      height: 100dvh;
    }

    .detail-panel { display: none; }

    body.detail-open .leads-panel { display: none; }
    body.detail-open .detail-panel { display: flex; }

    .panel-header {
      padding-top: max(18px, env(safe-area-inset-top));
    }

    .detail-topbar {
      padding-top: max(14px, env(safe-area-inset-top));
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .chat-msg { max-width: 86%; }

    .detail-scroll {
      padding-bottom: max(20px, env(safe-area-inset-bottom));
    }
  }
  .whatsapp-btn {
  margin-top: 8px;
  background: #25D366;
  color: white;
  border: none;
  padding: 8px 12px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
}

.whatsapp-btn:hover {
  background: #1ebe5d;
}

::-webkit-scrollbar {
  width: 0px;
  background: transparent;
}
</style>
</head>

<body>
  <main class="app">
    <section class="panel leads-panel">
      <header class="panel-header">
        <h1 class="dashboard-title">FitLead Dashboard</h1>
        <p class="dashboard-subtitle">כל הפניות במקום אחד</p>
      </header>

      <div class="search-wrap">
        <input id="searchInput" class="search-input" type="text" placeholder="חיפוש לפי שם או טלפון..." />
      </div>

      <div id="leadsList" class="leads-list">
        <div class="loading">טוען לידים...</div>
      </div>
    </section>

    <section class="panel detail-panel">
      <div id="detailEmpty" class="detail-empty">
        <div class="empty-card">
          <div class="empty-icon">👈</div>
          <div>בחר ליד מהרשימה כדי לראות פרטים ושיחה</div>
        </div>
      </div>

      <div id="leadDetail" class="lead-detail">
        <div class="detail-topbar">
          <button class="back-btn" onclick="closeLeadDetail()">חזור</button>
          <div class="detail-person">
            <div class="detail-name-row">
              <div id="detailName" class="detail-name"></div>
              <div id="detailStatus"></div>
            </div>
            <div id="detailPhone" class="detail-phone"></div>
            <button id="whatsappBtn" class="whatsapp-btn" type="button">
            פתיחה ב-WhatsApp
          </button>
          </div>
        </div>

        <div class="detail-scroll">
          <section class="summary-box">
            <div class="section-title">סיכום ליד</div>
            <div id="detailSummary" class="summary-text"></div>
          </section>

          <div class="messages-title">היסטוריית שיחה</div>
          <div id="chatHistory" class="chat-history"></div>
        </div>
      </div>
    </section>
  </main>

<script>
  const API = window.location.origin;

  const leadsListEl = document.getElementById("leadsList");
  const leadDetailEl = document.getElementById("leadDetail");
  const detailEmptyEl = document.getElementById("detailEmpty");
  const detailNameEl = document.getElementById("detailName");
  const detailPhoneEl = document.getElementById("detailPhone");
  const detailStatusEl = document.getElementById("detailStatus");
  const detailSummaryEl = document.getElementById("detailSummary");
  const chatHistoryEl = document.getElementById("chatHistory");
  const whatsappBtn = document.getElementById("whatsappBtn");
  const searchInput = document.getElementById("searchInput");

  let allLeads = [];
  let selectedLeadId = null;

  function statusToHebrew(status) {
    if (status === "Hot Lead") return "לקוח חם";
    if (status === "Cold Lead") return "לקוח קר";
    return "לקוח בתהליך";
  }

  function statusClass(status) {
    if (status === "Hot Lead") return "status-hot";
    if (status === "Cold Lead") return "status-cold";
    return "status-pending";
  }

  function statusPill(status) {
    const label = statusToHebrew(status);
    const cls = statusClass(status);
    return `<span class="status-pill ${cls}">${label}</span>`;
  }

  function formatDate(value) {
    if (!value) return "";
    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return String(value);

    return date.toLocaleString("he-IL", {
      day: "2-digit",
      month: "2-digit",
      hour: "2-digit",
      minute: "2-digit"
    });
  }

  function escapeHTML(value) {
    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function getLeadStatus(lead) {
    return lead.final_status || lead.status || "pending";
  }

  function getLeadPhone(lead) {
    return lead.phone || lead.phone_number || "אין טלפון";
  }

  function renderLeads(leads) {
    if (!leads.length) {
      leadsListEl.innerHTML = `<div class="loading">אין לידים להצגה</div>`;
      return;
    }

    leadsListEl.innerHTML = "";

    leads.forEach(lead => {
      const btn = document.createElement("button");
      btn.className = "lead-card";
      if (lead.lead_id === selectedLeadId) btn.classList.add("active");

      btn.innerHTML = `
        <div class="lead-top">
          <div class="lead-name">${escapeHTML(lead.name || "ללא שם")}</div>
          ${statusPill(getLeadStatus(lead))}
        </div>
        <div class="lead-phone">${escapeHTML(getLeadPhone(lead))}</div>
      `;

      btn.onclick = () => openLead(lead);
      leadsListEl.appendChild(btn);
    });
  }

  async function loadLeads() {
    try {
      const res = await fetch(`${API}/api/dashboard/leads`);
      if (!res.ok) throw new Error("Failed to load leads");

      allLeads = await res.json();
      renderLeads(allLeads);
    } catch (err) {
      leadsListEl.innerHTML = `<div class="error">שגיאה בטעינת הלידים</div>`;
    }
  }

  async function openLead(lead) {
    selectedLeadId = lead.lead_id;
    renderLeads(getFilteredLeads());

    detailEmptyEl.style.display = "none";
    leadDetailEl.style.display = "flex";
    document.body.classList.add("detail-open");

    detailNameEl.textContent = lead.name || "ללא שם";
    detailPhoneEl.textContent = getLeadPhone(lead);
    detailStatusEl.innerHTML = statusPill(getLeadStatus(lead));
    detailSummaryEl.textContent = lead.summary || "אין סיכום עדיין.";
    whatsappBtn.onclick = () => {
    let phone = getLeadPhone(lead).replace(/\D/g, "");

    if (phone.startsWith("0")) {
      phone = "972" + phone.slice(1);
    }

    const message = encodeURIComponent(
      `היי ${lead.name || ""}, ראיתי שהשארת פרטים 👋`
    );

    window.open(`https://wa.me/${phone}?text=${message}`, "_blank");
  };

    chatHistoryEl.innerHTML = `<div class="loading">טוען שיחה...</div>`;

    try {
      const res = await fetch(`${API}/api/dashboard/leads/${lead.lead_id}/messages`);
      if (!res.ok) throw new Error("Failed to load messages");

      const messages = await res.json();
      renderMessages(messages);
    } catch (err) {
      chatHistoryEl.innerHTML = `<div class="error">שגיאה בטעינת השיחה</div>`;
    }
  }

  function renderMessages(messages) {
    if (!messages.length) {
      chatHistoryEl.innerHTML = `<div class="loading">אין הודעות לשיחה הזו</div>`;
      return;
    }

    chatHistoryEl.innerHTML = "";

    messages.forEach(msg => {
      const role = msg.role === "user" ? "user" : "bot";

      const div = document.createElement("div");
      div.className = `chat-msg ${role}`;

      div.innerHTML = `
        <div class="chat-bubble">${escapeHTML(msg.content)}</div>
        <div class="msg-time">${escapeHTML(formatDate(msg.created_at))}</div>
      `;

      chatHistoryEl.appendChild(div);
    });
  }

  function closeLeadDetail() {
    document.body.classList.remove("detail-open");
  }

  function getFilteredLeads() {
    const q = searchInput.value.trim().toLowerCase();
    if (!q) return allLeads;

    return allLeads.filter(lead => {
      const name = String(lead.name || "").toLowerCase();
      const phone = String(getLeadPhone(lead)).toLowerCase();
      const status = statusToHebrew(getLeadStatus(lead)).toLowerCase();

      return name.includes(q) || phone.includes(q) || status.includes(q);
    });
  }

  searchInput.addEventListener("input", () => {
    renderLeads(getFilteredLeads());
  });

  loadLeads();
</script>
</body>
</html>
