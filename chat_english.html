<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FitLead Chat</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  * { -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #0d0d0f;
    --surface: #16161a;
    --surface2: #1e1e24;
    --border: #2a2a32;
    --accent: #c8ff57;
    --accent-dim: rgba(200,255,87,0.12);
    --text: #f0f0f0;
    --text-muted: #8a8a98;
    --bubble-bot: #111113;
    --radius: 18px;
  }

  html {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
  }

  body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    font-family: 'Heebo', sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    background-image:
      radial-gradient(ellipse at 20% 50%, rgba(200,255,87,0.05) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 20%, rgba(120,80,255,0.05) 0%, transparent 50%);
  }

  .chat-wrapper {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    left: 0;
    width: 100%;
    max-width: 480px;
    height: 100dvh;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    background: var(--surface);
    overflow: hidden;
  }

  @supports (height: 100svh) {
    .chat-wrapper { height: 100svh; }
  }

  @media (min-width: 500px) {
    .chat-wrapper {
      position: relative;
      width: min(480px, calc(100vw - 32px));
      height: min(92dvh, 780px);
      max-height: 780px;
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: 0 40px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.03);
    }
  }

  .header {
    padding: 14px 16px 13px;
    padding-top: max(14px, env(safe-area-inset-top));
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(22,22,26,0.96);
    flex-shrink: 0;
  }

  .avatar {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: var(--accent-dim);
    border: 1.5px solid var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }

  .header-info { flex: 1; min-width: 0; }

  .header-name {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: -0.3px;
  }

  .status-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 2px;
  }

  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .status-text {
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 300;
  }

  .messages {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 18px 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
  }

  .messages::-webkit-scrollbar { width: 3px; }
  .messages::-webkit-scrollbar-track { background: transparent; }
  .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .msg {
    display: flex;
    flex-direction: column;
    max-width: min(84%, 360px);
    animation: fadeUp 0.18s ease;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.bot { align-self: flex-start; }
  .msg.user { align-self: flex-end; align-items: flex-end; }

  .bubble {
    padding: 11px 14px;
    border-radius: var(--radius);
    font-size: 14.5px;
    line-height: 1.55;
    font-weight: 400;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    word-break: break-word;
  }

  .msg.bot .bubble {
    background: var(--bubble-bot);
    border: 1px solid var(--border);
    border-bottom-right-radius: 6px;
    color: var(--text);
  }

  .msg.user .bubble {
    background: var(--accent-dim);
    border: 1px solid rgba(200,255,87,0.22);
    border-bottom-left-radius: 6px;
    color: var(--text);
  }

  .msg-time {
    font-size: 10.5px;
    color: var(--text-muted);
    margin-top: 4px;
    padding: 0 4px;
    font-weight: 300;
  }

  .typing {
    display: flex;
    gap: 5px;
    padding: 13px 15px;
    background: var(--bubble-bot);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    border-bottom-right-radius: 6px;
    width: fit-content;
    align-self: flex-start;
    animation: fadeUp 0.18s ease;
  }

  .typing span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--text-muted);
    animation: bounce 1.2s infinite;
  }

  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-5px); opacity: 1; }
  }

  .done-banner {
    margin: 8px 14px;
    padding: 12px 14px;
    background: var(--accent-dim);
    border: 1px solid rgba(200,255,87,0.25);
    border-radius: 14px;
    font-size: 13px;
    color: var(--accent);
    text-align: center;
    font-weight: 500;
    display: none;
    flex-shrink: 0;
  }


  .input-area {
    border-top: 1px solid var(--border);
    background: rgba(22,22,26,0.98);
    flex-shrink: 0;
  }


  .input-area {
    padding: 10px 12px;
    padding-bottom: max(10px, env(safe-area-inset-bottom));
    display: none;
  }

  .input-row {
    display: flex;
    gap: 9px;
    align-items: flex-end;
    min-width: 0;
  }

  .input-box {
    flex: 1;
    min-width: 0;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 11px 14px;
    color: var(--text);
    font-size: 16px;
    font-family: 'Heebo', sans-serif;
    outline: none;
    resize: none;
    min-height: 46px;
    max-height: 112px;
    line-height: 1.45;
    transition: border-color 0.2s, background 0.2s;
    overflow-y: hidden;
    -webkit-appearance: none;
  }

  .input-box:focus { border-color: rgba(200,255,87,0.48); background: #202028; }
  .input-box::placeholder { color: #777785; }

  .send-btn {
    width: 46px;
    height: 46px;
    background: var(--accent);
    border: none;
    border-radius: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: opacity 0.2s, transform 0.08s;
  }


  .interest-yes,
  .interest-no {
    display: none;
    border: none;
    padding: 12px 16px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }

  .interest-yes {
  background: var(--accent);
  color: #0d0d0f;
}

.interest-no {
  background: var(--surface2);
  color: var(--text);
  border: 1px solid var(--border);
}


.booking-slots {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 8px;
  margin-bottom: 10px;
}

.booking-slot {
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 14px;
  padding: 12px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: 0.2s ease;
}

.booking-cancel {
  grid-column: 1 / -1;
  background: transparent;
  border: 1px dashed var(--border);
  color: var(--text-muted);
  border-radius: 12px;
  padding: 10px 12px;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  transition: 0.2s ease;
}

.booking-cancel:hover {
  background: rgba(255,255,255,0.03);
  color: var(--text);
}

  .send-btn:active { opacity: 0.85; transform: scale(0.98); }
  .send-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .send-btn svg { width: 18px; height: 18px; }

  .error-msg .bubble {
    background: rgba(255,80,80,0.08);
    border-color: rgba(255,80,80,0.2);
    color: #ff8080;
  }

  @media (max-width: 360px) {
    .messages { padding: 14px 10px; gap: 10px; }
    .msg { max-width: 88%; }
    .bubble { font-size: 14px; padding: 10px 13px; }
    .header { padding-right: 12px; padding-left: 12px; }
    .input-area { padding-right: 9px; padding-left: 9px; }
  }
</style>
</head>
<body>

<div class="chat-wrapper" id="chatWrapper">
  <div class="header">
    <div class="avatar">💬</div>
    <div class="header-info">
      <div class="header-name">A few quick questions</div>
      <div class="status-row">
        <div class="status-dot"></div>
        <div class="status-text">Takes less than a minute</div>
      </div>
    </div>
  </div>

  <div class="messages" id="messages"></div>

  <div class="done-banner" id="doneBanner">✓ Thanks! We'll be in touch soon</div>


  <div class="input-area" id="inputArea">
    <button class="interest-yes" id="bookingYes" onclick="BookingInterest('yes')">Yes, schedule a call</button>
    <button class="interest-no" id="bookingNo" onclick="BookingInterest('no')">Not right now</button>
    <div class="booking-slots" id="bookingSlots"></div>
    <div class="input-row">
      <textarea class="input-box" id="msgInput" placeholder="Type a message..." rows="1" maxlength="100"></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="#0d0d0f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>

  </div>
</div>

<script>
  const API = window.location.origin;
  let name = null;
  let waitingForName = false;
  let done = false;

  const bookingYes = document.getElementById('bookingYes');
  const bookingNo = document.getElementById('bookingNo');
  const booking_slots = document.getElementById("bookingSlots")
  const messagesEl = document.getElementById('messages');
  const inputArea = document.getElementById('inputArea');
  const msgInput = document.getElementById('msgInput');
  const sendBtn = document.getElementById('sendBtn');
  const doneBanner = document.getElementById('doneBanner');
  const chatWrapper = document.getElementById('chatWrapper');

  // ===== תיקון מקלדת מובייל =====
  // שומר את הגובה המקורי


  function now() {
    return new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
  }

  function scrollToBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function addMsg(text, role, isError=false) {
    const div = document.createElement('div');
    div.className = `msg ${role}${isError ? ' error-msg' : ''}`;
    div.innerHTML = `<div class="bubble">${text}</div><div class="msg-time">${now()}</div>`;
    messagesEl.appendChild(div);
    scrollToBottom();
    return div;
  }

  function showTyping() {
    const div = document.createElement('div');
    div.className = 'typing';
    div.id = 'typing';
    div.innerHTML = '<span></span><span></span><span></span>';
    messagesEl.appendChild(div);
    scrollToBottom();
  }

  function hideTyping() {
    const t = document.getElementById('typing');
    if (t) t.remove();
  }

  async function callAPI(nameVal, contentVal) {
    const body = { name: nameVal ?? null, content: contentVal ?? null };
    const res = await fetch(`${API}/message`, {
      method: 'POST',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    if (!res.ok) throw new Error('Server error');
    return await res.json();
  }


  async function callBookingAPI(contentVal) {
  const body = { content: contentVal };

  const res = await fetch(`${API}/message`, {
    method: 'POST',
    credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });

  if (!res.ok) throw new Error('Server error');

  return await res.json();
}


  function showBookingInterest(){
    inputArea.style.display = 'block';
    msgInput.style.display = 'none';
    sendBtn.style.display = 'none';

    bookingYes.style.display = 'block';
    bookingNo.style.display = 'block';
  }
  
  async function BookingInterest(choice) {
    bookingYes.style.display = 'none';
    bookingNo.style.display = 'none';
    let status;

  if (choice === 'yes') {
    status = true;
  } else {
    status = false;
  }

  await callBookingAPI({ status: status });
  const data = await callBookingAPI(null);
  
if (data.status == "booking_selection") {
  showBookingSlots(data.message);
  }
}



function showBookingSlots(slots) {
  const bookingSlots = document.getElementById('bookingSlots');
  bookingSlots.innerHTML = '';
  slots.forEach(slot => {
    const button = document.createElement('button');
    button.className = 'booking-slot';
    button.textContent = slot.label;
    button.onclick = () => {
      selectBookingSlot(slot.id);
    };
    bookingSlots.appendChild(button);
  });
  
  const cancelButton = document.createElement('button');
  cancelButton.className = 'booking-cancel';
  cancelButton.textContent = "Couldn't find a good time";
  cancelButton.onclick = () => {
    declineBooking();
  };
  bookingSlots.appendChild(cancelButton);
}


async function selectBookingSlot(slotId) {
  const data = await callBookingAPI({
    status: true,
    value: slotId
  });
}

async function declineBooking() {
  const data = await callBookingAPI({
    status: false,
    value: null
  });
}


  
  async function sendMessage() {
    if (done) return;
    const text = msgInput.value.trim();
    if (waitingForName && text.length > 20) {
    addMsg('Please enter a shorter name.', 'bot', true);
    return;
  }
    if (!text) return;
    addMsg(text, 'user');
    msgInput.value = '';
    msgInput.style.height = 'auto';
    sendBtn.disabled = true;
    msgInput.disabled = true;
    showTyping();
    try {
      let data;
      if (waitingForName) {
        name = text;
        data = await callAPI(name, null);
      } else {
        data = await callAPI(null, text);
      }
      waitingForName = data.status === 'new';
      hideTyping();
      addMsg(data.content, 'bot');
      
      if (data.status == "booking_interest"){
        showBookingInterest()
      }

      if (data.status == "booking_selection"){
        showBookingSlots(data.message)
      }

      if (data.status == "email") {
        bookingYes.style.display = 'none';
        bookingNo.style.display = 'none';

        msgInput.style.display = 'block';
        sendBtn.style.display = 'flex';
      }
      
      if (data.status === 'DONE') {
        done = true;
        msgInput.disabled = true;
        sendBtn.disabled = true;
        doneBanner.style.display = 'block';
      } else {
      msgInput.disabled = false;
      sendBtn.disabled = false;
      }
    } catch(e) {
      hideTyping();
      addMsg('Something went wrong. Please try again.', 'bot', true);
      msgInput.disabled = false;
      sendBtn.disabled = false;
    }
  }

  msgInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      if (!sendBtn.disabled) sendMessage();
    }
  });


  msgInput.addEventListener('input', () => {
    if (waitingForName && msgInput.value.length > 20) {
      msgInput.value = msgInput.value.slice(0, 20);
    }

    if (!waitingForName && msgInput.value.length > 100) {
      msgInput.value = msgInput.value.slice(0, 100);
    }

    msgInput.style.height = 'auto';
    msgInput.style.height = Math.min(msgInput.scrollHeight, 120) + 'px';
    sendBtn.disabled = msgInput.value.trim() === '';

  });

  if (window.visualViewport) {
    function syncMobileViewport() {
      if (window.innerWidth < 500) {
        chatWrapper.style.height = window.visualViewport.height + 'px';
        chatWrapper.style.top = window.visualViewport.offsetTop + 'px';
      } else {
        chatWrapper.style.height = '';
        chatWrapper.style.top = '';
      }
      scrollToBottom();
    }

    window.visualViewport.addEventListener('resize', syncMobileViewport);
    window.visualViewport.addEventListener('scroll', syncMobileViewport);
    syncMobileViewport();
  }


  window.onload = async () => {
    try {
      const res = await fetch(`${API}/message`, {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({})
      });
      const data = await res.json();
      addMsg(data.content, 'bot');

      if (data.status === 'new') waitingForName = true;

      

      inputArea.style.display = 'block';
      msgInput.disabled = false;
      sendBtn.disabled = false;
    } catch (e) {
      addMsg('Could not connect to the server.', 'bot', true);
    }
  };
</script>
</body>
</html>
